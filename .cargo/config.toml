[target.aarch64-linux-android]
# Portable linker name — requires NDK LLVM toolchain in PATH.
# Recommended: build via ./build_android.sh which auto-detects ANDROID_NDK_HOME
# and exports CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER.
# For direct `cargo build --target aarch64-linux-android`, ensure
# $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin is in PATH.
linker = "aarch64-linux-android36-clang"
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
    "-C", "link-arg=-Wl,--hash-style=both"
]
