[package]
name = "cache-cleaner-daemon"
version = "1.0.0"
edition = "2021"
authors = ["Antigravity Developer"]
description = "High-performance, zero-idle-overhead Android cache cleaner & system optimizer daemon in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "0.38", features = ["fs", "event", "net", "process", "system", "time", "thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
